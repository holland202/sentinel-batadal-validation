<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 576" width="1040" height="576" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#2b6f8f" stroke-width="1.6"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#64757f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="1040" height="576" fill="#eef1f3"/>

  <text x="40" y="46" font-size="19" font-weight="700" fill="#16202b" letter-spacing="1.5">SENTINEL x BATADAL — EVALUATION PIPELINE</text>
  <text x="40" y="68" font-size="11.5" fill="#64757f" letter-spacing=".6">two-window Jensen–Shannon divergence on per-channel sensor histograms · 156 lines · NumPy only</text>
  <line x1="40" y1="84" x2="1000" y2="84" stroke="#9fb0bd" stroke-width="1"/>

  <!-- column headers -->
  <g font-size="9.5" fill="#64757f" letter-spacing="1.6">
    <text x="46" y="112">INPUT</text>
    <text x="246" y="112">INGEST</text>
    <text x="446" y="112">CALIBRATE — CLEAN DATA ONLY</text>
    <text x="726" y="112">SCORE</text>
    <text x="886" y="112">REPORT</text>
  </g>

  <!-- ================= clean rail ================= -->
  <rect x="40" y="130" width="158" height="56" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="54" y="152" font-size="12" font-weight="700" fill="#16202b">dataset03.csv</text>
  <text x="54" y="169" font-size="10.5" fill="#64757f">8,761 rows · no attacks</text>

  <line x1="198" y1="158" x2="238" y2="158" stroke="#2b6f8f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="240" y="130" width="152" height="56" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="254" y="152" font-size="12" font-weight="700" fill="#16202b">load()</text>
  <text x="254" y="169" font-size="10.5" fill="#2f7d5e">0 coercions · 0 unlabeled</text>

  <line x1="392" y1="158" x2="432" y2="158" stroke="#2b6f8f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="434" y="130" width="150" height="56" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="448" y="152" font-size="12" font-weight="700" fill="#16202b">Detector.fit()</text>
  <text x="448" y="169" font-size="10.5" fill="#64757f">bin edges · 43 channels</text>

  <line x1="584" y1="158" x2="620" y2="158" stroke="#2b6f8f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="622" y="130" width="150" height="56" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="636" y="152" font-size="12" font-weight="700" fill="#16202b">calibrate()</text>
  <text x="636" y="169" font-size="10.5" fill="#64757f">99.5th pct of clean</text>

  <!-- threshold drop -->
  <path d="M697,186 L697,244" fill="none" stroke="#2b6f8f" stroke-width="1.6" stroke-dasharray="4 3"/>
  <path d="M697,244 L697,300" fill="none" stroke="#2b6f8f" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="712" y="228" width="112" height="30" fill="#eef1f3"/>
  <text x="718" y="248" font-size="10.5" fill="#2b6f8f">threshold</text>

  <!-- ================= test rail ================= -->
  <rect x="40" y="302" width="158" height="56" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="54" y="324" font-size="12" font-weight="700" fill="#16202b">test_dataset.csv</text>
  <text x="54" y="341" font-size="10.5" fill="#b4442c">2,089 rows · 7 attacks</text>

  <line x1="198" y1="330" x2="238" y2="330" stroke="#2b6f8f" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="240" y="302" width="152" height="56" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="254" y="324" font-size="12" font-weight="700" fill="#16202b">load()</text>
  <text x="254" y="341" font-size="10.5" fill="#2f7d5e">integrity counter</text>

  <line x1="392" y1="330" x2="616" y2="330" stroke="#2b6f8f" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="452" y="322" font-size="10" fill="#64757f">43 sensor channels, hourly</text>

  <rect x="622" y="302" width="150" height="56" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="636" y="324" font-size="12" font-weight="700" fill="#16202b">score()</text>
  <text x="636" y="341" font-size="10.5" fill="#64757f">agg + per-channel</text>

  <!-- fan out to three reports -->
  <path d="M772,330 L800,330 L800,186 L836,186" fill="none" stroke="#2b6f8f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M772,330 L800,330 L800,272 L836,272" fill="none" stroke="#2b6f8f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M772,330 L836,330" fill="none" stroke="#2b6f8f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="838" y="160" width="162" height="52" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="850" y="180" font-size="11.5" font-weight="700" fill="#16202b">evaluate()</text>
  <text x="850" y="198" font-size="10.5" fill="#64757f">F1 0.225 · 4/7 episodes</text>

  <rect x="838" y="246" width="162" height="52" fill="#ffffff" stroke="#16202b" stroke-width="1.4"/>
  <text x="850" y="266" font-size="11.5" font-weight="700" fill="#16202b">attribution()</text>
  <text x="850" y="284" font-size="10.5" fill="#64757f">7/7 attack-area top-5</text>

  <rect x="838" y="304" width="162" height="52" fill="#ffffff" stroke="#b4442c" stroke-width="2"/>
  <text x="850" y="324" font-size="11.5" font-weight="700" fill="#16202b">batadal_score()</text>
  <text x="850" y="342" font-size="10.5" font-weight="700" fill="#b4442c">S = 0.432</text>

  <!-- verdict strip: TRUE proportional axis, S in [0,1] -->
  <line x1="40" y1="396" x2="1000" y2="396" stroke="#9fb0bd" stroke-width="1"/>
  <text x="40" y="420" font-size="9.5" fill="#64757f" letter-spacing="1.6">WHERE THAT LANDS</text>
  <text x="40" y="437" font-size="10" fill="#64757f">BATADAL score S,</text>
  <text x="40" y="452" font-size="10" fill="#64757f">plotted to scale</text>

  <line x1="196" y1="452" x2="1000" y2="452" stroke="#16202b" stroke-width="1.2"/>
  <g stroke="#9fb0bd" stroke-width="1">
    <line x1="196" y1="452" x2="196" y2="458"/><line x1="397" y1="452" x2="397" y2="458"/>
    <line x1="598" y1="452" x2="598" y2="458"/><line x1="799" y1="452" x2="799" y2="458"/>
    <line x1="1000" y1="452" x2="1000" y2="458"/>
  </g>
  <g font-size="9" fill="#9fb0bd">
    <text x="192" y="470">0.0</text><text x="393" y="470">0.25</text>
    <text x="594" y="470">0.50</text><text x="795" y="470">0.75</text><text x="988" y="470">1.0</text>
  </g>

  <!-- 0.432 this baseline -->
  <line x1="543" y1="426" x2="543" y2="452" stroke="#b4442c" stroke-width="1.6"/>
  <circle cx="543" cy="452" r="5" fill="#b4442c"/>
  <text x="537" y="420" font-size="10.5" font-weight="700" fill="#b4442c" text-anchor="end">this baseline 0.432</text>

  <!-- 0.500 naive -->
  <line x1="598" y1="436" x2="598" y2="452" stroke="#64757f" stroke-width="1"/>
  <circle cx="598" cy="452" r="3.5" fill="#9fb0bd"/>
  <text x="606" y="433" font-size="10" fill="#64757f">0.500 naive always-safe</text>

  <!-- 0.534 lowest published -->
  <line x1="625" y1="452" x2="625" y2="486" stroke="#64757f" stroke-width="1"/>
  <circle cx="625" cy="452" r="3.5" fill="#9fb0bd"/>
  <text x="633" y="486" font-size="10" fill="#64757f">0.534 lowest published entry</text>

  <!-- 0.970 winner -->
  <line x1="976" y1="436" x2="976" y2="452" stroke="#64757f" stroke-width="1"/>
  <circle cx="976" cy="452" r="3.5" fill="#9fb0bd"/>
  <text x="968" y="433" font-size="10" fill="#64757f" text-anchor="end">0.970 winner</text>

  <!-- verification band -->
  <line x1="40" y1="506" x2="1000" y2="506" stroke="#9fb0bd" stroke-width="1"/>
  <text x="40" y="528" font-size="9.5" fill="#64757f" letter-spacing="1.6">VERIFICATION — RUNS WITHOUT THE DATASET</text>
  <g font-size="10.5" fill="#16202b">
    <text x="404" y="528"><tspan font-weight="700" fill="#2f7d5e">test_smoke.py</tspan> 11/11</text>
    <text x="560" y="528"><tspan font-weight="700" fill="#2f7d5e">math_audit.py</tspan> 16 properties</text>
    <text x="770" y="528"><tspan font-weight="700" fill="#b4442c">--sabotage</tspan> must exit 1</text>
  </g>
  <text x="40" y="550" font-size="10.5" fill="#64757f">Reproduced identically on x86_64 / glibc / Python 3.12 and aarch64 / Termux / Python 3.14.</text>
  <text x="770" y="550" font-size="10" fill="#64757f" font-style="italic">Vincit Omnia Veritas</text>
</svg>
